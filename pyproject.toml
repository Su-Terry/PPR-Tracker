[project]
name = "ppr-tracker"
version = "0.1.0"
description = "Alpha Strategist — CFO Warden System (跨台美股 Agentic AI 監控系統)"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "clarabel>=0.11.1",
    "cvxpy>=1.8.2",
    "fastmcp>=3.2.4",
    "google-genai>=2.0.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "slack-bolt>=1.28.0",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
